<!DOCTYPE html>
<html>
  <style>
  body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #07100f, #102522);
    margin: 0;
    padding: 20px;
  }
p, li, label {
  color: #d7e5e2;
  font-size: 16px;
}

h3 {
  color: #00c9a7;
}
  h1 {
  color: #00c9a7;
  font-size: 38px;
  text-align: center;
  margin-top: 30px;
  letter-spacing: 1px;
  }
  .card {
  background: #13201e;
  padding: 20px;
  margin: 20px 0;
  border-radius: 15px;
  border: 1px solid #1f5c52;
  box-shadow: 0 4px 15px rgba(0,0,0,0.4);
  }
.analyze-btn {
  background: #00c9a7;
  color: #07100f;
  border: none;
  padding: 12px 25px;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.analyze-btn:hover {
  background: #19e6c1;
}
h2 {
  color: #00c9a7;
  border-left: 4px solid #00c9a7;
  padding-left: 10px;
  margin-top: 30px;
}</style>
<head>
  <title>Mobile Usage Survey Dashboard</title>
</head>
<body>

  <h1>Mobilyze</h1>
  <p>Smart Mobile Usage Planner & Analyser</p>

  <hr>
<h2>Mobile Usage Planner</h2>

<div class="card">
  <h3>📅 Plan Your Activity</h3>

  <label>Choose Activity:</label>
  <select id="activity">
    <option>Study</option>
    <option>Gaming</option>
    <option>Social Media</option>
    <option>Entertainment</option>
    <option>Communication</option>
  </select>

  <br><br>

  <label>Start Time:</label>
  <input type="time" id="startTime">

  <br><br>

  <label>End Time:</label>
  <input type="time" id="endTime">

  <br><br>

  <button class="analyze-btn" onclick="addSchedule()">Add Schedule</button>

  <p id="scheduleResult"></p>
</div>
  <p><b>Total Students Surveyed:</b> 90</p>
  
  <ul>
    <li>Less than 2 hours: 8 students</li>
    <li>2–4 hours: 22 students</li>
    <li>4–6 hours: 31 students</li>
    <li>6–8 hours: 19 students</li>
    <li>More than 8 hours: 10 students</li></ul>
  </div>
  </ul>

  <script>
    function addSchedule() {
  let activity = document.getElementById("activity").value;
  let startTime = document.getElementById("startTime").value;
  let endTime = document.getElementById("endTime").value;

  if (startTime === "" || endTime === "") {
    document.getElementById("scheduleResult").innerHTML =
      "Please select both start and end time.";
    return;
  }

  document.getElementById("scheduleResult").innerHTML =
    "✅ " + activity + " scheduled from <b>" +
    startTime + "</b> to <b>" + endTime + "</b>";
    }
  </script>
<script>
  const ctx = document.getElementById('usageChart');

  new Chart(ctx, {
    type: 'bar',
    data: {
      labels: ['<2 hrs', '2–4 hrs', '4–6 hrs', '6–8 hrs', '>8 hrs'],
      datasets: [{
        label: 'Students',
        data: [8, 22, 31, 19, 10]
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: {
          labels: {
            color: '#d7e5e2'
          }
        }
      },
      scales: {
        x: {
          ticks: {
            color: '#d7e5e2'
          }
        },
        y: {
          ticks: {
            color: '#d7e5e2'
          }
        }
      }
    }
  });
</script>
 <script>
function addSchedule() {
  let activity = document.getElementById("activity").value;
  let start = document.getElementById("startTime").value;
  let end = document.getElementById("endTime").value;

  if (start === "" || end === "") {
    alert("Please select start and end time.");
    return;
  }

  let schedule = document.createElement("p");

  schedule.innerHTML =
    "<b>" + activity + "</b> — " + start + " to " + end;

  document.getElementById("scheduleList").appendChild(schedule);
}
 </script> 
</body>
</html>
