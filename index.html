<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mobilyze - Smart Mobile Usage Planner</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #07100f, #102522);
      color: #d7e5e2;
      min-height: 100vh;
      padding: 25px;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    header {
      text-align: center;
      padding: 30px 10px;
    }

    header h1 {
      color: #00c9a7;
      font-size: 44px;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    header p {
      color: #d7e5e2;
      font-size: 17px;
    }

    .card {
      background: #13201e;
      border: 1px solid #1f5c52;
      border-radius: 18px;
      padding: 25px;
      margin: 20px 0;
      box-shadow: 0 6px 20px rgba(0,0,0,0.35);
    }

    h2 {
      color: #00c9a7;
      border-left: 4px solid #00c9a7;
      padding-left: 12px;
      margin-bottom: 20px;
    }

    h3 {
      color: #00c9a7;
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin: 12px 0 7px;
      color: #d7e5e2;
      font-weight: bold;
    }

    select,
    input {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      border: 1px solid #1f5c52;
      background: #0b1413;
      color: white;
      font-size: 16px;
    }

    button {
      border: none;
      cursor: pointer;
      border-radius: 9px;
      padding: 13px 22px;
      font-size: 16px;
      font-weight: bold;
      margin-top: 18px;
    }

    .add-btn {
      background: #00c9a7;
      color: #07100f;
      width: 100%;
    }

    .add-btn:hover {
      background: #19e6c1;
    }

    .delete-btn {
      background: #7a302d;
      color: white;
      padding: 8px 14px;
      font-size: 13px;
      margin-top: 10px;
    }

    .delete-btn:hover {
      background: #a83b36;
    }

    #message {
      margin-top: 15px;
      font-weight: bold;
      color: #00c9a7;
      text-align: center;
    }

    .schedule-item {
      background: #0b1715;
      border: 1px solid #1f5c52;
      border-radius: 12px;
      padding: 18px;
      margin-top: 12px;
    }

    .schedule-item h3 {
      margin-bottom: 8px;
    }

    .time {
      color: #ffffff;
      font-size: 16px;
    }

    .empty {
      color: #9eb4af;
      text-align: center;
      padding: 15px;
    }

    .progress-box {
      margin-top: 15px;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .progress {
      width: 100%;
      height: 12px;
      background: #07100f;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: #00c9a7;
      border-radius: 10px;
    }

    footer {
      text-align: center;
      margin-top: 35px;
      padding: 20px;
      color: #8da7a1;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      body {
        padding: 15px;
      }

      header h1 {
        font-size: 36px;
      }

      .card {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <h1>Mobilyze</h1>
      <p>Smart Mobile Usage Planner & Analyser</p>
    </header>

    <!-- PLANNER -->
    <section class="card">

      <h2>📅 Mobile Usage Planner</h2>

      <h3>Plan Your Activity</h3>

      <label for="activity">Choose Activity</label>

      <select id="activity">
        <option value="Study">📚 Study</option>
        <option value="Gaming">🎮 Gaming</option>
        <option value="Social Media">📱 Social Media</option>
        <option value="Entertainment">🎬 Entertainment</option>
        <option value="Communication">💬 Communication</option>
      </select>

      <label for="startTime">Start Time</label>
      <input type="time" id="startTime">

      <label for="endTime">End Time</label>
      <input type="time" id="endTime">

      <button class="add-btn" onclick="addSchedule()">
        ➕ Add Schedule
      </button>

      <p id="message"></p>

    </section>


    <!-- SAVED SCHEDULE -->
    <section class="card">

      <h2>🗓️ My Schedule</h2>

      <div id="scheduleList">
        <p class="empty">No activities scheduled yet.</p>
      </div>

    </section>


    <!-- WEEKLY PROGRESS -->
    <section class="card">

      <h2>📊 Weekly Progress</h2>

      <div class="progress-box">

        <div class="progress-label">
          <span>📚 Study</span>
          <span>60%</span>
        </div>

        <div class="progress">
          <div class="progress-fill" style="width:60%"></div>
        </div>

      </div>


      <div class="progress-box">

        <div class="progress-label">
          <span>🎮 Gaming</span>
          <span>40%</span>
        </div>

        <div class="progress">
          <div class="progress-fill" style="width:40%"></div>
        </div>

      </div>


      <div class="progress-box">

        <div class="progress-label">
          <span>📱 Social Media</span>
          <span>50%</span>
        </div>

        <div class="progress">
          <div class="progress-fill" style="width:50%"></div>
        </div>

      </div>

      <div class="progress-box">

        <div class="progress-label">
          <span>🎬 Entertainment</span>
          <span>30%</span>
        </div>

        <div class="progress">
          <div class="progress-fill" style="width:30%"></div>
        </div>

      </div>

    </section>


    <footer>
      Mobilyze © 2026 | Smart Mobile Usage Planner & Analyser
    </footer>

  </div>


  <script>

    function addSchedule() {

      const activity =
        document.getElementById("activity").value;

      const startTime =
        document.getElementById("startTime").value;

      const endTime =
        document.getElementById("endTime").value;

      const message =
        document.getElementById("message");

      const scheduleList =
        document.getElementById("scheduleList");


      // Check time
      if (startTime === "" || endTime === "") {

        message.innerHTML =
          "⚠️ Please select both start and end time.";

        return;
      }


      // Check if end time is after start time
      if (endTime <= startTime) {

        message.innerHTML =
          "⚠️ End time must be after start time.";

        return;
      }


      // Remove empty message
      const emptyMessage =
        document.querySelector(".empty");

      if (emptyMessage) {
        emptyMessage.remove();
      }


      // Create schedule card
      const schedule =
        document.createElement("div");

      schedule.className =
        "schedule-item";


      schedule.innerHTML =

        "<h3>" +
        getEmoji(activity) +
        " " +
        activity +
        "</h3>" +

        "<p class='time'>⏰ " +
        formatTime(startTime) +
        " → " +
        formatTime(endTime) +
        "</p>" +

        "<button class='delete-btn' onclick='deleteSchedule(this)'>" +
        "🗑️ Delete" +
        "</button>";


      scheduleList.appendChild(schedule);


      // Success message
      message.innerHTML =
        "✅ " +
        activity +
        " has been scheduled!";


      // Clear times
      document.getElementById("startTime").value = "";
      document.getElementById("endTime").value = "";

    }


    function deleteSchedule(button) {

      button.parentElement.remove();


      const scheduleList =
        document.getElementById("scheduleList");


      if (scheduleList.children.length === 0) {

        scheduleList.innerHTML =
          "<p class='empty'>No activities scheduled yet.</p>";

      }

    }


    function getEmoji(activity) {

      if (activity === "Study") {
        return "📚";
      }

      if (activity === "Gaming") {
        return "🎮";
      }

      if (activity === "Social Media") {
        return "📱";
      }

      if (activity === "Entertainment") {
        return "🎬";
      }

      if (activity === "Communication") {
        return "💬";
      }

      return "📱";
    }


    function formatTime(time) {

      let parts = time.split(":");

      let hour = parseInt(parts[0]);

      let minute = parts[1];

      let period = "AM";


      if (hour >= 12) {
        period = "PM";
      }

      if (hour > 12) {
        hour = hour - 12;
      }

      if (hour === 0) {
        hour = 12;
      }

      return hour + ":" + minute + " " + period;

    }

  </script>

</body>
</html>
